site_name: OaK
site_description: Paper-grounded implementation, artifacts, revisions, and validation
theme:
  name: readthedocs
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [".", "src"]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 3
markdown_extensions:
  - tables
  - fenced_code
nav:
  - Start: index.md
  - Active execution plan: historical-execution-replay-plan.md
  - Verified pilot: verification/acceptance.md
  - Verified MCP slice: verification/mcp-slice.md
  - Stack and setup: stack.md
  - Paper:
      - Specification: paper/method-spec.md
      - Extracted text: paper/extracted/paper-text.md
  - Design: design.md
  - Deferred preservation reference: kernel-preservation-plan.md
  - Evidence and decision log: work-plan.md
  - Runtime:
      - Method and boundaries: runtime-method.md
      - MCP surfaces: mcp-surface.md
      - Corpus: corpus.md
      - Ontology semantics: ontology-semantics.md
      - Functions: functions.md
      - Learning flow: learning-flow.md
      - Verification flow: verification-flow.md
      - Materialization: materialization.md
      - Regressions: regression.md
      - Interface: ui.md
      - Gemini: gemini.md
      - Coffee protocol: coffee-protocol.md
  - Code reference:
      - Runtime: reference/runtime.md
      - Setup: reference/setup.md
  - Review prompt: review/gemini-prompt.md
