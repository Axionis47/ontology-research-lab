[project]
name = "oak"
version = "0.1.0"
description = "Observable, versioned implementation of OaK from arXiv:2608.22974v1"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "jsonschema==4.26.0",
  "langchain==1.4.8",
  "langchain-core==1.7.4",
  "langchain-openai==1.7.3",
  "langchain-anthropic==1.7.9",
  "langgraph==1.2.19",
  "langgraph-checkpoint-sqlite==3.1.3",
  "langsmith==0.14.17",
  "networkx==3.7",
  "owlready2==0.51",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
  "sqlmodel==0.0.48",
  "streamlit==1.66.1",
  "structlog==26.1.0",
  "typer==0.27.3",
  "mcp==2.3.0",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[project.scripts]
oak = "oak.cli:app"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
docs = [
  "mkdocs==1.6.1",
  "mkdocstrings[python]==1.0.8",
  "mkdocstrings-python==2.0.10",
]
paper = ["beautifulsoup4==4.15.0", "pypdfium2==5.14.0"]

[tool.uv]
required-version = "==0.12.0"
default-groups = ["dev", "docs", "paper"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".agents", ".tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"] # Ruff's formatter controls wrapping; prompts and SQL may remain longer.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
